name: Format circle-removal follow-up

on:
  push:
    branches:
      - fix/remove-tiny-country-markers
    paths:
      - .github/workflows/format-circle-removal.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/remove-tiny-country-markers
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxfmt components/world-map.tsx lib/map-lod.ts packages/data-pipeline/map/build-lod.mjs
      - name: Commit formatter output
        run: |
          git add components/world-map.tsx lib/map-lod.ts packages/data-pipeline/map/build-lod.mjs
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format circle-removal follow-up"
          git push origin HEAD:fix/remove-tiny-country-markers
