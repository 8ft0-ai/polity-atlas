name: Temporary legislature pilot candidate

on:
  push:
    branches: [feat/legislature-pilots-party-colours]

permissions:
  contents: write

jobs:
  candidate:
    if: "!contains(github.event.head_commit.message, 'Build legislature pilot candidate')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/legislature-pilots-party-colours
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run data:refresh:ipu -- --retrieved-at=2026-09-19T04:30:00.000Z --build-id=2026-09-19
      - name: Inspect source contracts
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const snapshot = JSON.parse(await readFile('.cache/ipu/MMR.json', 'utf8'));
          for (const chamber of snapshot.chambers) {
            const selected = Object.fromEntries(
              Object.entries(chamber.attributes ?? {}).filter(([key]) =>
                /(status|suspend|active|chamber_name)/i.test(key),
              ),
            );
            console.log('MMR_CHAMBER_ATTRIBUTES', chamber.id, JSON.stringify(selected));
          }
          NODE
          curl -fsS --get 'https://www.wikidata.org/w/rest.php/wikibase/v1/search/items' \
            --data-urlencode 'q=Australian Labor Party' \
            --data-urlencode 'language=en' \
            --data-urlencode 'limit=2' \
            | head -c 4000
          echo
      - run: npm run data:refresh:wikipedia -- --retrieved-at=2026-09-19T04:35:00.000Z --build-id=2026-09-19
      - run: npm run format
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build legislature pilot candidate"
          git push origin HEAD:feat/legislature-pilots-party-colours
