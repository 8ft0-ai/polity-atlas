name: Format LOD generator

on:
  push:
    branches:
      - feat/map-lod
    paths:
      - .github/workflows/format-lod-generator.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/map-lod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxfmt packages/data-pipeline/map/build-lod.mjs
      - name: Commit formatter output
        run: |
          git add packages/data-pipeline/map/build-lod.mjs
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format LOD generator"
          git push origin HEAD:feat/map-lod
