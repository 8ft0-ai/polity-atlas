name: Format PR 28

on:
  push:
    branches:
      - feat/pilot-profiles-and-branding
    paths:
      - .github/workflows/format-pr-28.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/pilot-profiles-and-branding
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxfmt components/geopolitical-workspace.test.tsx lib/countries.test.ts packages/schemas/country.test.ts public/data/countries/AUS.json public/data/countries/CAN.json public/data/countries/CHN.json public/data/countries/FRA.json public/data/countries/GBR.json public/data/countries/IDN.json public/data/countries/IND.json public/data/countries/JPN.json public/data/countries/NZL.json public/data/countries/USA.json
      - name: Commit formatter output
        run: |
          git add components/geopolitical-workspace.test.tsx lib/countries.test.ts packages/schemas/country.test.ts public/data/countries/*.json
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format pilot profiles and tests"
          git push origin HEAD:feat/pilot-profiles-and-branding
