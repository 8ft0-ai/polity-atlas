name: Validate geopolitical data

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - name: Adapter status
        run: echo "Source adapters will be enabled after their access and reuse terms are approved."
