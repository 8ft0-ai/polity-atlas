name: Temporary PR 33 formatter

on:
  push:
    branches: [feat/wikipedia-chamber-fallback]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'Format PR 33')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wikipedia-chamber-fallback
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Format PR 33"
          git push origin HEAD:feat/wikipedia-chamber-fallback
