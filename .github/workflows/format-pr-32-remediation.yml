name: Format PR 32 remediation

on:
  push:
    branches:
      - feat/global-source-registry
    paths:
      - .github/workflows/format-pr-32-remediation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/global-source-registry
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxfmt components/country-panel.test.tsx packages/data-pipeline/ipu/refresh.mjs
      - name: Commit formatter output
        run: |
          git add components/country-panel.test.tsx packages/data-pipeline/ipu/refresh.mjs
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format PR 32 remediation"
          git push origin HEAD:feat/global-source-registry
