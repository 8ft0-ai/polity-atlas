name: Format probe

on:
  pull_request:
    paths:
      - components/world-map.tsx
      - lib/robinson.ts
      - .github/workflows/format-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatter diff
        run: |
          npm run format
          git diff -- components/world-map.tsx lib/robinson.ts
