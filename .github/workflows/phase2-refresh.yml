name: Temporary Phase 2 data refresh

on:
  push:
    branches: [feat/wikipedia-chamber-composition]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'Refresh Phase 2 Wikipedia data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wikipedia-chamber-composition
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run data:refresh:wikipedia -- --retrieved-at=2026-09-19T02:50:00.000Z --build-id=2026-09-19
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Phase 2 Wikipedia data"
          git push origin HEAD:feat/wikipedia-chamber-composition
