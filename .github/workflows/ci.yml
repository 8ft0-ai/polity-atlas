name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary Phase 4 PR1 exact formatter patch
        run: |
          npx oxfmt packages/data-pipeline/wikipedia/party-acquisition.mjs packages/data-pipeline/wikipedia/party-identity.mjs packages/data-pipeline/wikipedia/party-identity.test.mjs packages/data-pipeline/wikipedia/party-association.mjs packages/data-pipeline/wikipedia/prepare-parties.mjs packages/data-pipeline/wikipedia/refresh.mjs packages/data-pipeline/wikidata/client.test.mjs
          git diff -- packages/data-pipeline/wikipedia/party-acquisition.mjs packages/data-pipeline/wikipedia/party-identity.mjs packages/data-pipeline/wikipedia/party-identity.test.mjs packages/data-pipeline/wikipedia/party-association.mjs packages/data-pipeline/wikipedia/prepare-parties.mjs packages/data-pipeline/wikipedia/refresh.mjs packages/data-pipeline/wikidata/client.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
