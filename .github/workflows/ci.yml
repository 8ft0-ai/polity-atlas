name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary PR A exact formatter patch
        run: |
          npx oxfmt components/country-panel.test.tsx packages/data-pipeline/config/party-aliases.json packages/data-pipeline/wikipedia/party-identity.mjs packages/data-pipeline/wikipedia/party-identity.test.mjs packages/data-pipeline/wikipedia/refresh.mjs public/data/countries/AUS.json
          git diff -- components/country-panel.test.tsx packages/data-pipeline/config/party-aliases.json packages/data-pipeline/wikipedia/party-identity.mjs packages/data-pipeline/wikipedia/party-identity.test.mjs packages/data-pipeline/wikipedia/refresh.mjs public/data/countries/AUS.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
