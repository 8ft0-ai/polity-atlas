name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture exact Phase 4 formatter output (temporary)
        run: |
          npm run format -- packages/schemas/party.ts packages/data-pipeline/wikipedia/party.test.mjs
          git diff -- packages/schemas/party.ts packages/data-pipeline/wikipedia/party.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
