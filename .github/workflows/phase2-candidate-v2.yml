name: Temporary Phase 2 candidate build v2

on:
  push:
    branches: [feat/wikipedia-chamber-composition]

permissions:
  contents: write

jobs:
  candidate:
    if: "!contains(github.event.head_commit.message, 'Build Phase 2 candidate v2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wikipedia-chamber-composition
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run data:refresh:wikipedia -- --retrieved-at=2026-09-19T03:20:00.000Z --build-id=2026-09-19
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Phase 2 candidate v2"
          git push origin HEAD:feat/wikipedia-chamber-composition
