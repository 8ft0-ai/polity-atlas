name: LOD source probe

on:
  push:
    branches:
      - feat/map-lod

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect Natural Earth map-unit identities
        run: |
          for lod in 110m 50m 10m; do
            url="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_${lod}_admin_0_map_units.geojson"
            echo "LOD=${lod}"
            curl -fsSL "$url" | jq -c '[.features[].properties | select(
              (.NAME // "") as $n |
              ["Kosovo","N. Cyprus","Northern Cyprus","Somaliland","Abkhazia","South Ossetia","Transnistria","W. Sahara","Western Sahara"] | any(. == $n)
            ) | {NAME,NAME_LONG,ADM0_A3,SOV_A3,ISO_A3,ISO_N3,TYPE,SOVEREIGNT,ADMIN,GEOUNIT,NOTE_ADM0}]'
          done
          for lod in 110m 50m 10m; do
            url="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_${lod}_admin_0_map_units.geojson"
            echo "SEARCH_LOD=${lod}"
            curl -fsSL "$url" | jq -c '[.features[] | select((.properties | tostring | test("Abkhazia|South Ossetia|Transnistria"; "i"))) | {p: .properties, type: .geometry.type}] | map({name:(.p.NAME // .p.NAME_LONG // .p.GEOUNIT // null), adm0_a3:.p.ADM0_A3, geounit:.p.GEOUNIT, subunit:.p.SUBUNIT, brk_name:.p.BRK_NAME, note:.p.NOTE_ADM0, type:.p.TYPE})'
          done
