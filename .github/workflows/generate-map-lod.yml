name: Generate map LOD assets

on:
  push:
    branches:
      - feat/map-lod
    paths:
      - packages/data-pipeline/map/build-lod.mjs
      - .github/workflows/generate-map-lod.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/map-lod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node packages/data-pipeline/map/build-lod.mjs
      - name: Commit generated assets
        run: |
          if git diff --quiet -- public/data/geometry/lod; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/geometry/lod
          git commit -m "Generate synchronized map LOD assets"
          git push origin HEAD:feat/map-lod
