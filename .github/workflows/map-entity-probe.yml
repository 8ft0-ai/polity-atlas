name: Map entity probe

on:
  push:
    branches:
      - feat/map-entity-policy

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect bundled world-atlas feature identities
        run: |
          node --input-type=module <<'NODE'
          import { feature } from 'topojson-client';
          import topology from 'world-atlas/countries-110m.json' with { type: 'json' };
          const collection = feature(topology, topology.objects.countries);
          const rows = collection.features.map((f, index) => ({
            index,
            id: f.id ?? null,
            name: f.properties?.name ?? null,
            type: f.geometry?.type ?? null
          }));
          console.log('ALL_FEATURES=' + JSON.stringify(rows));
          console.log('MISSING_ID=' + JSON.stringify(rows.filter((row) => row.id == null)));
          NODE
      - name: Inspect Natural Earth 50m country classifications
        run: |
          curl -fsSL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_50m_admin_0_countries.geojson \
            | jq -c '[.features[].properties | {ADMIN,ADM0_A3,SOVEREIGNT,SOV_A3,TYPE,ISO_A3,ISO_N3,UN_A3,NAME}]' \
            | sed 's/^/NE_COUNTRIES=/'
          curl -fsSL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_50m_admin_0_countries.geojson \
            | jq -c '[.features[].properties.TYPE] | group_by(.) | map({type: .[0], count: length})' \
            | sed 's/^/NE_TYPES=/'
          curl -fsSL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_50m_admin_0_countries.geojson \
            | jq -c '[.features[].properties | select(.TYPE != "Sovereign country") | {ADMIN,ADM0_A3,SOVEREIGNT,SOV_A3,TYPE,ISO_A3,ISO_N3,UN_A3,NAME}]' \
            | sed 's/^/NE_NON_SOVEREIGN=/'

